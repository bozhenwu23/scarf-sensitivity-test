<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCARF 敏感度測驗</title>
  <style>
    :root{--ink:#19352f;--paper:#fffdf8;--muted:#64766f;--green:#286f63;--gold:#d4a458;--line:#d8ddd6}*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.hero{padding:70px 20px 86px;background:radial-gradient(circle at 15% 15%,#3e8275 0,transparent 28%),linear-gradient(135deg,#173a33,#204f46);color:#fff;text-align:center}.hero small{font-weight:800;letter-spacing:.18em;color:#d7ad6a}.hero h1{margin:14px 0 12px;font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(38px,8vw,68px)}.hero p{max-width:720px;margin:auto;color:#dce8e4;line-height:1.8}.meta{display:flex;justify-content:center;gap:24px;margin-top:24px;color:#dce8e4}.wrap{width:min(920px,calc(100% - 28px));margin:-38px auto 60px}.card{margin-bottom:18px;padding:25px;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 14px 35px rgba(25,53,47,.08)}.progress{position:sticky;top:8px;z-index:5;padding:16px 20px}.progress-copy{display:flex;justify-content:space-between;font-weight:800}.track{height:7px;margin-top:10px;border-radius:99px;background:#dfe4df;overflow:hidden}.track span{display:block;height:100%;background:var(--green);transition:.2s}.mode-grid,.identity{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.mode{display:flex;gap:10px;padding:15px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.mode:has(input:checked){border-color:var(--green);background:#edf6f2}.mode input{accent-color:var(--green)}.mode span{display:grid;gap:3px}.mode small{color:var(--muted)}.identity{grid-template-columns:1fr 1fr 1.3fr}.field{display:grid;gap:7px;font-size:13px;font-weight:800}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.consent{display:flex;gap:10px;margin-top:18px;padding:13px;border-radius:10px;background:#eef2ed;color:#50645d;font-size:13px;line-height:1.5}.consent input{accent-color:var(--green)}fieldset{border:0}.question legend{margin-bottom:15px;font-weight:900}.question legend b{margin-right:9px;color:#b36d3e}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{position:relative;display:flex;gap:12px;align-items:flex-start;min-height:132px;padding:18px;border:1px solid var(--line);border-radius:13px;cursor:pointer;line-height:1.65}.choice:has(input:checked){border-color:var(--green);background:#edf6f2}.choice input{position:absolute;opacity:0}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:50%;background:#eceae3;font-family:Georgia,serif;font-weight:900}.choice:has(input:checked) .letter{background:var(--green);color:white}.actions{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:24px;background:var(--ink);color:white}.actions p{margin:4px 0 0;color:#bed0ca;font-size:13px}.buttons{display:flex;gap:9px}.buttons button{padding:13px 17px;border:0;border-radius:10px;background:var(--gold);color:var(--ink);font-weight:900;cursor:pointer}.buttons .ghost{border:1px solid #78928b;background:transparent;color:white}.buttons button:disabled{opacity:.35;cursor:not-allowed}.result{display:none;padding:35px}.result.show{display:block}.result h2{text-align:center;font-family:Georgia,"Noto Serif TC",serif;font-size:34px}.result h2 em{color:#b36d3e;font-style:normal}.scores{display:grid;gap:13px;margin-top:25px}.score{display:grid;grid-template-columns:115px 1fr 45px;gap:12px;align-items:center}.bar{height:9px;border-radius:99px;background:#dedfd8;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit}.note{margin-top:22px;padding:16px;border-radius:11px;background:#eef4f1;color:#476159;text-align:center}.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}.tip{padding:18px;border:1px solid var(--line);border-radius:12px}.tip h3{margin:0 0 8px}.tip p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}footer{text-align:center;padding:25px;color:#71817b;font-size:12px}@media(max-width:700px){.choices,.identity,.mode-grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.buttons{flex-direction:column}.buttons button{width:100%}.score{grid-template-columns:95px 1fr 38px}.meta{gap:12px;font-size:13px}}
  </style>
</head>
<body>
  <header class="hero"><small>SCARF 自我探索</small><h1>什麼最能驅動你？</h1><p>從十組工作情境中，選出每一題你更喜歡的那一個，看看你對地位、確定性、自主性、關聯性與公平性的敏感度。</p><div class="meta"><span>10 組情境</span><span>每題 2 選 1</span><span>約 3 分鐘</span></div></header>
  <main class="wrap">
    <section class="card progress"><div class="progress-copy"><span>作答進度</span><strong id="progressText">0 / 10</strong></div><div class="track"><span id="progressBar" style="width:0"></span></div></section>
    <section class="card"><small>填答方式</small><h2>選擇記名或不記名</h2><p>只有選擇保存時才會傳送資料；也可以不保存直接查看結果。</p><div class="mode-grid"><label class="mode"><input type="radio" name="mode" value="named" checked onchange="updateMode()"><span><strong>記名填答</strong><small>保存姓名，可選填部門與 Email</small></span></label><label class="mode"><input type="radio" name="mode" value="anonymous" onchange="updateMode()"><span><strong>不記名填答</strong><small>不保存姓名、部門或 Email</small></span></label></div><div class="identity" id="identity"><label class="field">姓名（保存時必填）<input id="name" maxlength="100" placeholder="請輸入姓名"></label><label class="field">部門<input id="department" maxlength="100" placeholder="例如：行銷部"></label><label class="field">Email（選填）<input id="email" maxlength="200" type="email" placeholder="name@example.com"></label></div><label class="consent"><input id="consent" type="checkbox" onchange="updateActions()"><span>我同意保存上述資料與本次測驗結果，供管理者查閱與後續分析。</span></label></section>
    <div id="questions"></div>
    <section class="card actions"><div><strong id="statusTitle">還有 10 題未作答</strong><p id="statusText">每題選擇一個最符合你的情境</p></div><div class="buttons"><button class="ghost" id="viewBtn" onclick="viewOnly()" disabled>不保存，直接看結果</button><button id="saveBtn" onclick="saveAndView()" disabled>保存並查看結果</button></div></section>
    <section class="card result" id="result"><h2>你最敏感的面向是<br><em id="topNames"></em></h2><div class="scores" id="scores"></div><div class="tips" id="tips"></div><div class="note" id="resultNote"></div></section>
  </main><footer>本測驗供自我探索與溝通參考，並非心理診斷工具。</footer>
  <script>
    const dimensions={S:{name:'地位',color:'#d35d36',tip:'公開肯定貢獻，並提供能展現專業或影響力的機會。'},C:{name:'確定性',color:'#d79b2e',tip:'提早說明變化，提供清晰的目標、步驟與時間表。'},A:{name:'自主性',color:'#39947f',tip:'說清楚目標後保留方法選擇，提供彈性與決定空間。'},R:{name:'關聯性',color:'#4d7fb8',tip:'建立包容支持的氛圍，重視感受並安排真誠交流。'},F:{name:'公平性',color:'#785fa2',tip:'採用一致透明的規則，並清楚說明決策與資源分配。'}};
    const questions=[
      [{d:'S',t:'在一個重要專案會議上，主管公開稱讚了你的主要貢獻，並明確將專案成果與你的名字關聯。'},{d:'C',t:'主管為你接下來一個季度的工作目標，提供了一份清晰、穩定的任務計畫，以及時間進度表。'}],
      [{d:'A',t:'主管指派你一個新任務，訂下明確的目標期望，然後告訴你：「過程和方法由你全權決定，我充分信任你。」'},{d:'R',t:'你上班時工作氣氛很好，團隊成員間會彼此照顧支持，也經常聚會，讓你感覺像是一家人。'}],
      [{d:'F',t:'公司的晉升制度完全透明，名額、標準、評審過程和結果全部公開，你覺得完全憑實力說話。'},{d:'S',t:'你被授予一個「專家顧問」的無給職，能接觸高層並發表個人意見，這在公司裡是極少數。'}],
      [{d:'C',t:'即使公司處於變革期，主管也總能第一時間向你傳達最新、最明確的資訊，讓你對未來變化不會太焦慮。'},{d:'A',t:'你可以完全自由地安排自己的工作時間和地點，只需確保如期完成任務即可。'}],
      [{d:'R',t:'你和其他團隊成員有很好的默契和認同感，大家的價值觀一致，你感覺自己是其中不可或缺的一分子。'},{d:'F',t:'團隊內部的預算、獎勵分配總是遵循明確一致的規則；有疏失要懲罰時，主管不會有任何偏袒。'}],
      [{d:'S',t:'你因為某項專業很強，也曾幫過一些人，所以同事認為「找你就對了。」'},{d:'A',t:'你對自己的工作流程和工具擁有絕對的決定權，可以按照自己認為最高效率的方式工作。'}],
      [{d:'C',t:'你的績效考核標準多年來一直穩定、明確，你非常清楚該怎麼做，以及能得到什麼樣的評價和回報。'},{d:'F',t:'當跨單位出現衝突或利益糾紛時，公司有一套絕對公正、人人信服的仲裁程序。'}],
      [{d:'R',t:'你在公司有交到無話不談的朋友，和主管建立了亦師亦友的深厚信任關係。'},{d:'S',t:'在跨單位會議中，你發表的專業意見總是受到高度重視，並常被主席採納為決策依據。'}],
      [{d:'F',t:'你希望公司有一套機制，確保員工的額外付出（如加班）一定會獲得對等的補償或認可，絕不會被忽視。'},{d:'C',t:'你希望公司發展非常平穩，未來一年的規劃清晰可預見，幾乎不會有部門裁撤或失業的風險。'}],
      [{d:'A',t:'你在工作上希望能選擇是否參與某個專案；當其他單位有出缺且符合自己興趣或專長時，可以申請調動。'},{d:'R',t:'你希望主管記得團隊成員的生日並辦慶生會，或舉辦慶功活動，讓每個人獲得集體成就感。'}]
    ];
    const answers=Array(10).fill(null);const qRoot=document.getElementById('questions');
    questions.forEach((q,i)=>{const el=document.createElement('fieldset');el.className='card question';el.innerHTML=`<legend><b>${String(i+1).padStart(2,'0')}</b>你更喜歡哪一個？</legend><div class="choices">${q.map((c,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" onchange="choose(${i},${j})"><span class="letter">${j?'B':'A'}</span><span>${c.t}</span></label>`).join('')}</div>`;qRoot.appendChild(el)});
    function mode(){return document.querySelector('input[name="mode"]:checked').value}function updateMode(){document.getElementById('identity').style.display=mode()==='named'?'grid':'none';document.querySelector('.consent span').textContent=mode()==='named'?'我同意保存上述資料與本次測驗結果，供管理者查閱與後續分析。':'我同意以不記名方式保存本次測驗結果，供管理者統計與分析。';updateActions()}function choose(i,j){answers[i]=j;updateActions()}
    function updateActions(){const n=answers.filter(x=>x!==null).length;document.getElementById('progressText').textContent=`${n} / 10`;document.getElementById('progressBar').style.width=`${n*10}%`;document.getElementById('statusTitle').textContent=n<10?`還有 ${10-n} 題未作答`:'已完成，可以查看結果';document.getElementById('statusText').textContent=n<10?'每題選擇一個最符合你的情境':'可直接查看；只有選擇保存時才會傳送資料';document.getElementById('viewBtn').disabled=n<10;document.getElementById('saveBtn').disabled=n<10||!document.getElementById('consent').checked||(mode()==='named'&&!document.getElementById('name').value.trim())}document.getElementById('name').addEventListener('input',updateActions);
    function calculate(){const scores={S:0,C:0,A:0,R:0,F:0};answers.forEach((v,i)=>scores[questions[i][v].d]++);const high=Math.max(...Object.values(scores));const tops=Object.keys(scores).filter(k=>scores[k]===high);return{scores,tops,letters:answers.map(v=>v?'B':'A')}}
    function showResult(note){const r=calculate();document.getElementById('topNames').textContent=r.tops.map(k=>dimensions[k].name).join('、');document.getElementById('scores').innerHTML=Object.keys(dimensions).map(k=>`<div class="score"><strong>${dimensions[k].name}</strong><div class="bar"><i style="width:${r.scores[k]*25}%;background:${dimensions[k].color}"></i></div><b>${r.scores[k]}/4</b></div>`).join('');document.getElementById('tips').innerHTML=r.tops.map(k=>`<article class="tip"><h3>${dimensions[k].name}</h3><p>${dimensions[k].tip}</p></article>`).join('');document.getElementById('resultNote').textContent=note;document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth'})}
    function viewOnly(){showResult('本次結果僅顯示於此頁，沒有傳送或保存任何資料。')}
    async function saveAndView(){const calc=calculate();const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='正在保存…';const payload={publicSite:true,identityMode:mode(),name:mode()==='named'?document.getElementById('name').value.trim():'',department:mode()==='named'?document.getElementById('department').value.trim():'',email:mode()==='named'?document.getElementById('email').value.trim():'',consent:true,answers:calc.letters,scores:calc.scores,topDimension:calc.tops.map(k=>dimensions[k].name).join('、')};try{await fetch('https://script.google.com/macros/s/AKfycbwDcEAjzOijWS1byG2Ngj2i6Bx6_G53HtXzM-4J6vH1c94ojiq-WvGp8r2FnM3B8JZv5g/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});showResult('結果已送出至管理者的 Google 試算表。')}catch(error){showResult('結果已顯示，但目前無法保存。')}finally{btn.textContent='保存並查看結果';updateActions()}}
  </script>
</body>
</html>
